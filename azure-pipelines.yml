# CI del frontend (Angular 21).
#
# Cuando se lanza:
#   - PR hacia main (obligatoria: la rama main debe exigir que este pipeline este en verde)
#   - push a release
#   - semanalmente sobre Develop (los lunes a las 06:00 UTC, haya cambios o no)
#
# Etapas: Compilar -> SonarQube. Compilar corre en el agente hospedado de Azure (ubuntu-latest). SonarQube corre en un agente
# propio, porque el servidor de la universidad solo es accesible desde su red. El token de Sonar esta en sonar-project.properties.

trigger:
  branches:
    include:
      - release
      - release/*

pr:
  branches:
    include:
      - main

schedules:
  - cron: '0 6 * * 1'
    displayName: 'Ejecucion semanal sobre Develop'
    branches:
      include:
        - Develop
    always: true

stages:
  - stage: Compilar
    displayName: '1. Compilar'
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Compilacion
        displayName: 'Compilar con Angular'
        steps:
          - script: echo "Compilando el frontend (rama $(Build.SourceBranchName), commit $(Build.SourceVersion))"
            displayName: 'Inicio de la compilacion'

          - task: UseNode@1
            displayName: 'Instalar Node.js 22'
            inputs:
              version: '22.x'

          # npm ci instala exactamente lo que fija package-lock.json
          - script: npm ci
            displayName: 'Instalar dependencias (npm ci)'

          - script: npm run build
            displayName: 'Compilar (ng build)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefacto del frontend'
            inputs:
              targetPath: 'dist'
              artifact: 'frontend'

          - script: echo "Compilacion correcta y artefacto publicado"
            displayName: 'Fin de la compilacion'

  - stage: Sonar
    displayName: '2. SonarQube'
    dependsOn: Compilar
    # Agente local con VPN y sonar-scanner: la etapa solo corre en el
    pool:
      name: Default
      demands:
        - agent.name -equals agente-equipo4
    jobs:
      - job: AnalisisSonar
        displayName: 'Analisis con SonarQube (agente local)'
        steps:
          - checkout: self
            fetchDepth: 0
            displayName: 'Descargar el codigo'

          - script: echo "Analizando el frontend con SonarQube"
            displayName: 'Inicio del analisis'

          # El servidor, la clave del proyecto y las rutas estan en sonar-project.properties
          - script: sonar-scanner
            displayName: 'sonar-scanner'
            # Para que la etapa falle si no se supera el Quality Gate, anadir: -Dsonar.qualitygate.wait=true

          - script: echo "Analisis de SonarQube terminado"
            displayName: 'Fin del analisis'
