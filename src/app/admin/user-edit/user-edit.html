@if (form; as f) {
  <div class="overlay" (click)="onCancelar()">
    <div class="modal card" role="dialog" aria-modal="true" aria-labelledby="titulo-editar" (click)="$event.stopPropagation()">
      <p class="eyebrow">Editar usuario</p>
      <h2 id="titulo-editar">{{ original?.nombre }} {{ original?.apellidos }}</h2>

      <div class="grid formulario">
        <label class="campo">
          Email
          <input type="email" [value]="original?.email" readonly>
        </label>
        <label class="campo">
          Nombre *
          <input type="text" [(ngModel)]="f.nombre">
        </label>
        <label class="campo">
          Apellidos *
          <input type="text" [(ngModel)]="f.apellidos">
        </label>
        <label class="campo">
          DNI
          <input type="text" [(ngModel)]="f.dni">
        </label>
        <label class="campo">
          Teléfono
          <input type="tel" [(ngModel)]="f.telefono" maxlength="9">
        </label>
        @if (esAdmin) {
          <label class="campo">
            Sede
            <input type="text" [(ngModel)]="f.sede">
          </label>
        }
                @if (esCliente) {
          <label class="campo">
            Fecha de nacimiento
            <input type="date" [(ngModel)]="f.fechaNacimiento">
          </label>
        }
        @if (esVendedor) {
          <label class="campo">
            Nombre comercial *
            <input type="text" [(ngModel)]="f.nombreComercial">
          </label>
          <label class="campo">
            Categoría principal
            <select [(ngModel)]="f.categoriaPrincipalId">
              @for (c of categorias(); track c.id) {
                <option [value]="c.id">{{ c.nombre }}</option>
              }
            </select>
          </label>
        }

      </div>
            <span id="etiqueta-avatar-edit">Avatar</span>
      <div class="lista-avatares" role="radiogroup" aria-labelledby="etiqueta-avatar-edit">
        @for (id of avatares; track id) {
          <button type="button" class="opcion-avatar"
                  [class.elegido]="f.avatar === id" [attr.aria-pressed]="f.avatar === id"
                  (click)="f.avatar = id">
            <img [src]="'/avatares/' + carpetaAvatares + '/' + id + '.png'" alt="">
          </button>
        }
      </div>


      <p class="nota">El email no se puede modificar.</p>

      @if (error || errorServidor) {
        <div class="aviso aviso-error" role="alert">{{ error || errorServidor }}</div>
      }

      <div class="botones">
        <button type="button" class="btn btn-ghost" (click)="onCancelar()">Cancelar</button>
        <button type="button" class="btn btn-coral" (click)="onGuardar()">Guardar cambios</button>
      </div>
    </div>
  </div>
}
