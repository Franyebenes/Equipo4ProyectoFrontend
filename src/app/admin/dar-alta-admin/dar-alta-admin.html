<section class="admin-page">
  <div class="bar">
    <nav class="admin-tabs" aria-label="Administración">
      <a routerLink="/admin/usuarios" routerLinkActive="is-active">Usuarios</a>
      <a routerLink="/admin/administradores/nuevo" routerLinkActive="is-active">Dar de alta administrador</a>
      <a routerLink="/admin/crear-categoria" routerLinkActive="is-active">Crear categoría</a>
    </nav>

    <header class="page-head">
      <div>
        <p class="eyebrow">Panel de administración</p>
        <h1>Nuevo administrador</h1>
        <p class="sub">Crea una cuenta con permisos de administración.</p>
      </div>
    </header>

    <form class="card form-card" (ngSubmit)="enviar()">
      <h2 class="seccion">Datos personales</h2>
      <div class="grid">
        <label class="campo">
          Nombre *
          <input type="text" name="nombre" [(ngModel)]="datos.nombre" autocomplete="given-name">
        </label>
        <label class="campo">
          Apellidos *
          <input type="text" name="apellidos" [(ngModel)]="datos.apellidos" autocomplete="family-name">
        </label>
        <label class="campo">
          Email *
          <input type="email" name="email" [(ngModel)]="datos.email" autocomplete="email">
        </label>
        <label class="campo">
          Avatar (URL de la imagen)
          <input type="url" name="avatar" [(ngModel)]="datos.avatar" placeholder="https://...">
        </label>
      </div>

      <h2 class="seccion">Datos de administración</h2>
      <div class="grid">
        <label class="campo">
          Sede *
          <input type="text" name="sede" [(ngModel)]="datos.sede">
        </label>
        <label class="campo">
          Fecha de incorporación
          <input type="text" [value]="hoy" readonly disabled title="Se asigna automáticamente con la fecha de alta">
        </label>
      </div>

      <h2 class="seccion">Contraseña</h2>
      <div class="grid">
        <label class="campo">
          Contraseña *
          <span class="campo-pass">
            <input [type]="verContrasena() ? 'text' : 'password'" name="contrasena" [(ngModel)]="datos.contrasena" autocomplete="new-password">
            <button type="button" class="ojo" (click)="verContrasena.set(!verContrasena())"
                    [attr.aria-label]="verContrasena() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                    [attr.aria-pressed]="verContrasena()">
              <ng-container *ngTemplateOutlet="iconoOjo; context: { visible: verContrasena() }" />
            </button>
          </span>
        </label>
        <label class="campo">
          Repetir contraseña *
          <span class="campo-pass">
            <input [type]="verRepetir() ? 'text' : 'password'" name="repetirContrasena" [(ngModel)]="datos.repetirContrasena" autocomplete="new-password">
            <button type="button" class="ojo" (click)="verRepetir.set(!verRepetir())"
                    [attr.aria-label]="verRepetir() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                    [attr.aria-pressed]="verRepetir()">
              <ng-container *ngTemplateOutlet="iconoOjo; context: { visible: verRepetir() }" />
            </button>
          </span>
        </label>
      </div>

      @if (error()) {
        <div class="aviso aviso-error" role="alert">{{ error() }}</div>
      }
      @if (exito()) {
        <div class="aviso aviso-ok" role="status">
          {{ exito() }} <a routerLink="/admin/usuarios">Ver listado</a>
        </div>
      }

      <div class="botones">
        <a routerLink="/admin/usuarios" class="btn btn-ghost">Cancelar</a>
        <button type="submit" class="btn btn-coral" [disabled]="enviando()">
          {{ enviando() ? 'Creando…' : 'Crear administrador' }}
        </button>
      </div>
    </form>
  </div>
</section>

<ng-template #iconoOjo let-visible="visible">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
    <circle cx="12" cy="12" r="3" />
    @if (visible) {
      <path d="M3 3l18 18" />
    }
  </svg>
</ng-template>
