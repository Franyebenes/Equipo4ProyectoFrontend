<header class="topbar">
  <div class="bar">
    <a class="brand" routerLink="/" aria-label="ESIBuy, inicio">
      <span class="logo" aria-hidden="true">E</span>
      <span class="wordmark">ESIBuy</span>
    </a>

    <nav class="nav-desktop" aria-label="Principal">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Inicio</a>
      <button type="button">Cómo funciona</button>
      <button type="button">Seguridad</button>
      <button type="button">Ayuda</button>
    </nav>

    <div class="actions">
      <!-- Destinos de autenticación: solo las páginas pedidas. -->
      <a routerLink="/login" class="btn btn-ghost">Iniciar sesión</a>
      <a routerLink="/registro" class="btn btn-coral">Crear cuenta</a>
      <button
        type="button"
        class="menu-btn"
        (click)="alternarMenu()"
        [attr.aria-expanded]="menuAbierto()"
        aria-controls="menu-movil"
        aria-label="Abrir menú"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  @if (menuAbierto()) {
    <nav id="menu-movil" class="nav-mobile" aria-label="Principal">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="cerrarMenu()">Inicio</a>
      <button type="button" (click)="cerrarMenu()">Cómo funciona</button>
      <button type="button" (click)="cerrarMenu()">Seguridad</button>
      <button type="button" (click)="cerrarMenu()">Ayuda</button>
      <a routerLink="/login" class="btn btn-ghost" (click)="cerrarMenu()">Iniciar sesión</a>
      <a routerLink="/registro" class="btn btn-coral" (click)="cerrarMenu()">Crear cuenta</a>
    </nav>
  }
</header>

<!-- Home, login y registro se pintan aquí según la ruta. -->
<router-outlet />
