<button type="button" class="corazon" [class.lleno]="favorito()" [disabled]="enviando()"
        [attr.aria-pressed]="favorito()"
        [attr.aria-label]="(favorito() ? 'Quitar de favoritos ' : 'Añadir a favoritos ') + nombre()"
        [title]="favorito() ? 'Quitar de favoritos' : 'Añadir a favoritos'" (click)="alternar($event)">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 20.6l-1.3-1.2C5.9 15.1 3 12.4 3 9.1 3 6.4 5.1 4.4 7.7 4.4c1.5 0 2.9.7 3.8 1.8l.5.6.5-.6c.9-1.1
             2.3-1.8 3.8-1.8 2.6 0 4.7 2 4.7 4.7 0 3.3-2.9 6-7.7 10.3L12 20.6z" />
  </svg>
</button>
@if (error()) {
  <span class="error-favorito" role="alert">{{ error() }}</span>
}
